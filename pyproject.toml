[project]
name = "fixmypresence-lead-system"
version = "0.1.0"
description = "Operator-controlled lead discovery and enrichment automation"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "Bots/address-bot",
  "Bots/enricher/outputs",
  "Bots/maps_scraper/output",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
